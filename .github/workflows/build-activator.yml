name: Build Activator EXE

on:
  push:
    paths:
      - "activator/**"
      - ".github/workflows/build-activator.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: activator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -r requirements.txt pytest
      - name: Unit tests (Excel colors / names)
        run: python -m pytest -q tests
      - name: End-to-end test (real app + fake subscriptions window)
        run: python tests/e2e_windows.py
      - name: Build EXE
        run: pyinstaller --noconfirm --clean --onefile --windowed --name ActivatorHelper app.py
      - name: Launch built EXE (must stay running)
        shell: pwsh
        run: |
          $p = Start-Process dist\ActivatorHelper.exe -PassThru
          Start-Sleep -Seconds 8
          if ($p.HasExited) { Write-Error "EXE exited early with code $($p.ExitCode)"; exit 1 }
          Stop-Process $p -Force
          Write-Host "EXE started OK"
      - uses: actions/upload-artifact@v4
        with:
          name: ActivatorHelper
          path: activator/dist/ActivatorHelper.exe
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: activator-latest
          name: ActivatorHelper (latest)
          body: "Build from commit ${{ github.sha }}"
          prerelease: false
          files: activator/dist/ActivatorHelper.exe
