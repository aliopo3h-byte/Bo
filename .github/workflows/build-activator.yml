name: Build Activator EXE

on:
  push:
    paths:
      - "activator/**"
      - ".github/workflows/build-activator.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: activator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -r requirements.txt pytest
      - name: Unit tests (Excel colors / names)
        run: python -m pytest -q tests
      - name: End-to-end test (real app + fake subscriptions window)
        run: python tests/e2e_windows.py
      - name: Build folder version (recommended, zipped)
        run: pyinstaller --noconfirm --clean --onedir --windowed --name ActivatorHelper --distpath dist_dir --workpath build_dir app.py
      - name: Build single-file EXE
        run: pyinstaller --noconfirm --onefile --windowed --name ActivatorHelper app.py
      - name: Launch both builds (must stay running)
        shell: pwsh
        run: |
          foreach ($exe in @("dist_dir\ActivatorHelper\ActivatorHelper.exe", "dist\ActivatorHelper.exe")) {
            $p = Start-Process $exe -PassThru
            Start-Sleep -Seconds 8
            if ($p.HasExited) { Write-Error "$exe exited early with code $($p.ExitCode)"; exit 1 }
            Stop-Process $p -Force
            Write-Host "$exe started OK"
          }
      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) {
            $c = @("C:\Program Files (x86)\Inno Setup 6\ISCC.exe", "C:\Program Files\Inno Setup 6\ISCC.exe") | Where-Object { Test-Path $_ } | Select-Object -First 1
            $iscc = $c
          }
          if (-not $iscc) {
            choco install innosetup -y --no-progress
            $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          }
          & $iscc "installer\ActivatorHelper.iss"
          if ($LASTEXITCODE -ne 0) { exit 1 }
          if (-not (Test-Path ActivatorHelper-Setup.exe)) { Write-Error "Setup not produced"; exit 1 }
      - name: Test installer (silent install, registry, run, uninstall)
        shell: pwsh
        run: |
          $dir = "C:\inst_test"
          Start-Process .\ActivatorHelper-Setup.exe -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/DIR=$dir" -Wait
          if (-not (Test-Path "$dir\ActivatorHelper.exe")) { Write-Error "not installed"; exit 1 }
          $cmd = (Get-ItemProperty "HKCU:\Software\Classes\SystemFileAssociations\.xlsx\shell\ActivatorHelper\command").'(default)'
          Write-Host "right-click command: $cmd"
          if ($cmd -notlike "*$dir*ActivatorHelper.exe*%1*") { Write-Error "bad right-click command"; exit 1 }
          if (-not (Test-Path "HKCU:\Software\Classes\.xlsx\OpenWithList\ActivatorHelper.exe")) { Write-Error "no OpenWith entry"; exit 1 }
          $p = Start-Process "$dir\ActivatorHelper.exe" -PassThru
          Start-Sleep -Seconds 8
          if ($p.HasExited) { Write-Error "installed exe exited early"; exit 1 }
          Stop-Process $p -Force
          Start-Process "$dir\unins000.exe" -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART" -Wait
          Start-Sleep -Seconds 3
          if (Test-Path "HKCU:\Software\Classes\SystemFileAssociations\.xlsx\shell\ActivatorHelper") { Write-Error "registry not cleaned"; exit 1 }
          if (Test-Path "$dir\ActivatorHelper.exe") { Write-Error "files not removed"; exit 1 }
          Write-Host "Installer OK"
      - name: Package + checksums
        shell: pwsh
        run: |
          Compress-Archive -Path dist_dir\ActivatorHelper -DestinationPath ActivatorHelper.zip -Force
          Copy-Item dist\ActivatorHelper.exe ActivatorHelper.exe
          $z = (Get-FileHash ActivatorHelper.zip -Algorithm SHA256).Hash
          $e = (Get-FileHash ActivatorHelper.exe -Algorithm SHA256).Hash
          $zs = (Get-Item ActivatorHelper.zip).Length
          $es = (Get-Item ActivatorHelper.exe).Length
          $i = (Get-FileHash ActivatorHelper-Setup.exe -Algorithm SHA256).Hash
          $is = (Get-Item ActivatorHelper-Setup.exe).Length
          @"
          Build from commit ${{ github.sha }}

          **Recommended (install permanently):** download ``ActivatorHelper-Setup.exe`` and run it (no admin needed). It adds right-click -> "Open in ActivatorHelper" for Excel files.
          Portable alternative: ``ActivatorHelper.zip`` (extract and run ``ActivatorHelper\ActivatorHelper.exe``).

          | File | Size (bytes) | SHA-256 |
          |---|---|---|
          | ActivatorHelper-Setup.exe | $is | ``$i`` |
          | ActivatorHelper.zip | $zs | ``$z`` |
          | ActivatorHelper.exe | $es | ``$e`` |

          Verify: ``certutil -hashfile ActivatorHelper.zip SHA256``
          "@ | Out-File -Encoding utf8 ..\release_body.md
      - uses: actions/upload-artifact@v4
        with:
          name: ActivatorHelper
          path: |
            activator/ActivatorHelper-Setup.exe
            activator/ActivatorHelper.zip
            activator/ActivatorHelper.exe
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: activator-latest
          name: ActivatorHelper (latest)
          body_path: release_body.md
          prerelease: false
          files: |
            activator/ActivatorHelper-Setup.exe
            activator/ActivatorHelper.zip
            activator/ActivatorHelper.exe
