name: Build Activator EXE

on:
  push:
    paths:
      - "activator/**"
      - ".github/workflows/build-activator.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -r activator/requirements.txt
      - name: Smoke test
        working-directory: activator
        run: python -c "import app, excel_reader, pyautogui, tkinter; print('ok')"
      - name: Build
        working-directory: activator
        run: pyinstaller --noconfirm --onefile --windowed --name ActivatorHelper app.py
      - uses: actions/upload-artifact@v4
        with:
          name: ActivatorHelper
          path: activator/dist/ActivatorHelper.exe
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: activator-latest
          name: ActivatorHelper (latest)
          prerelease: false
          files: activator/dist/ActivatorHelper.exe
